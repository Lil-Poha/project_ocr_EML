# nginx отдаёт статическую страницу и перенаправляет запросы /api/ в gateway.
# Благодаря этому браузер обращается к одному адресу и не упирается в CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Чуть больше лимита gateway (10 МБ) с запасом на multipart-обёртку:
    # тогда о слишком большом файле понятно сообщит сам gateway
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Для проверки здоровья контейнера в docker-compose
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
