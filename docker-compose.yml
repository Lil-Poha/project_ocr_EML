# Запуск всего сервиса одной командой:  docker compose up --build
# Страница откроется на http://localhost:8080
#
# Схема:  браузер -> frontend (nginx) -> gateway -> recognizer
# Наружу открыт только frontend; gateway и recognizer доступны
# лишь внутри docker-сети по именам сервисов.

name: ocr-eml

services:
  recognizer:
    build: ./services/recognizer
    environment:
      RECOGNIZER_BACKEND: stub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    environment:
      RECOGNIZER_URL: http://recognizer:8000
      MAX_UPLOAD_MB: 10
      RECOGNIZER_TIMEOUT: 30
    depends_on:
      recognizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
